spring:
  application:
    name: checkout-backend
  datasource:
    # H2 en memoria: los datos (y el seed de Flyway) se reinician con la app. Ver DEC-003.
    url: jdbc:h2:mem:shop;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    fail-on-missing-locations: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Configuración de seguridad (spec 001). Todos los valores sensibles llegan por entorno;
# JWT_SECRET no tiene valor por defecto: sin él (o si mide < 32 bytes) la app no arranca.
app:
  security:
    jwt-secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:examen-ecommerce}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
    cookie-secure: ${COOKIE_SECURE:false}
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:4200}

# Se añade en su spec: app.discounts.* (003).
